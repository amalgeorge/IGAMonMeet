# Surfaces known CVEs in the Spring Boot 2.7 line and npm packages (ADR 0001).
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
