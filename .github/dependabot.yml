# Surfaces known CVEs in the Spring Boot 2.7 line and npm packages (ADR 0001).
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Spring Boot 3+ needs Jakarta EE and Tomcat 10+; the IIQ platform is Tomcat 9 (ADR 0001).
      # Patch and minor updates within 2.7 still come through.
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    # Packages that must move together arrive as one PR, so npm can resolve peer dependencies.
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vite:
        patterns: ["vite", "@vitejs/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
