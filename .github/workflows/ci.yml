name: CI

on:
  push:
    branches: [main, 'setup/**', 'feature/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build WAR and run tests
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        with: { name: igamonmeet-war, path: target/igamonmeet.war }

  migrations-mssql:
    # Runs every Flyway migration against real SQL Server (ADR 0006).
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env: { ACCEPT_EULA: 'Y', MSSQL_SA_PASSWORD: 'Ci_Passw0rd!2026' }
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci_Passw0rd!2026' -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: Create database
        run: docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci_Passw0rd!2026' -Q "CREATE DATABASE igamonmeet"
      - name: Apply migrations
        run: >-
          mvn -B -Dskip.frontend=true flyway:migrate
          -Dflyway.url='jdbc:sqlserver://localhost:1433;databaseName=igamonmeet;encrypt=true;trustServerCertificate=true'
          -Dflyway.user=sa -Dflyway.password='Ci_Passw0rd!2026'
          -Dflyway.locations=filesystem:src/main/resources/db/migration
