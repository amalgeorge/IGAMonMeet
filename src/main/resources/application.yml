spring:
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=igamonmeet;encrypt=true;trustServerCertificate=false}
    username: ${DB_USER:igamonmeet}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # schema owned by Flyway; columns covered by integration tests
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    # {vendor} adds database-specific scripts, e.g. db/vendor/sqlserver.
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
    placeholders:
      longText: NVARCHAR(MAX)
      longBinary: VARBINARY(MAX)
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
app:
  display-time-zone: Asia/Singapore
