spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    # Same SQL as production; H2 in MSSQLServer mode rejects the H2 dialect's LIMIT.
    database-platform: org.hibernate.dialect.SQLServer2012Dialect
    hibernate:
      ddl-auto: none # schema owned by Flyway; columns covered by integration tests
  flyway:
    enabled: true
    placeholders:
      # H2 has no NVARCHAR(MAX); production uses NVARCHAR(MAX).
      longText: CLOB
